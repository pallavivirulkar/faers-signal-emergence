<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAERS Signal Emergence — Progress Tracker</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#8b93a3; --accent:#5b8def; --done:#3ecf8e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; min-height:100vh;
  }
  main{flex:1; padding:32px 40px; max-width:820px;}
  h1{font-size:22px; margin:0 0 4px;}
  .subtitle{color:var(--muted); font-size:14px; margin-bottom:28px;}
  .week{margin-bottom:28px;}
  .week-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .week-head h2{font-size:15px; margin:0; color:var(--text);}
  .week-pct{font-size:12px; color:var(--muted);}
  .task{
    display:flex; align-items:flex-start; gap:10px; background:var(--panel);
    border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:8px;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .task:hover{border-color:#3a4152;}
  .task.done{background:var(--panel2); border-color:var(--done);}
  .task input{margin-top:3px; width:16px; height:16px; accent-color:var(--done); cursor:pointer; flex-shrink:0;}
  .task-text{font-size:14px; line-height:1.4;}
  .task-title{font-weight:600;}
  .task.done .task-title{color:var(--done);}
  .task-desc{color:var(--muted); font-size:12.5px; margin-top:2px;}

  aside{
    width:260px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border);
    padding:32px 24px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  }
  aside h3{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 16px;}
  .big-pct{font-size:40px; font-weight:700; margin-bottom:4px;}
  .big-label{font-size:12px; color:var(--muted); margin-bottom:18px;}
  .bar-track{
    width:100%; height:14px; background:var(--panel2); border-radius:7px; overflow:hidden; margin-bottom:28px;
    border:1px solid var(--border);
  }
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--done)); width:0%; transition:width .25s;}
  .week-bars{display:flex; flex-direction:column; gap:14px; flex:1;}
  .wb-row{}
  .wb-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .wb-track{height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; border:1px solid var(--border);}
  .wb-fill{height:100%; background:var(--accent); width:0%; transition:width .25s;}
  .reset-btn{
    margin-top:20px; background:none; border:1px solid var(--border); color:var(--muted);
    padding:8px; border-radius:6px; font-size:12px; cursor:pointer;
  }
  .reset-btn:hover{border-color:#5a6274; color:var(--text);}
</style>
</head>
<body>

<main>
  <h1>FAERS Signal Emergence — Progress Tracker</h1>
  <div class="subtitle">Project 1 · Drug: Semaglutide · openFDA + SQLite + Power BI + one GenAI summary</div>

  <div id="tasklist"></div>
</main>

<aside>
  <h3>Overall Progress</h3>
  <div class="big-pct" id="bigPct">0%</div>
  <div class="big-label" id="bigLabel">0 / 0 tasks complete</div>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <h3>By Week</h3>
  <div class="week-bars" id="weekBars"></div>

  <button class="reset-btn" id="resetBtn">Reset progress</button>
</aside>

<script>
const DATA = [
  { week: "Setup", tasks: [
    ["setup-env", "Environment setup", "venv, pip install requests pandas numpy scipy matplotlib jupyter, git init"],
    ["setup-key", "Get openFDA API key", "open.fda.gov/apis/authentication — raises limit to 120,000 req/day"],
    ["setup-scope", "Confirm scope: Semaglutide", "Locked in per recommendation — richest data, can add 2nd drug in Week 4"],
  ]},
  { week: "Week 1 — Data Engineering", tasks: [
    ["w1d1", "Day 1: API exploration", "First requests.get() call to /drug/event.json, inspect JSON structure"],
    ["w1d2", "Day 2: Find top reactions", "Use count=patient.reaction.reactionmeddrapt.exact, pick 3-5 signals to track"],
    ["w1d3", "Day 3: Design SQLite schema", "Create quarterly_counts table (drug, reaction, quarter, a/drug/reaction/all totals)"],
    ["w1d4", "Day 4: Build extraction loop", "Quarter-range queries × reactions, get_count() helper, populate quarterly_counts"],
    ["w1d5", "Day 5: Validate, clean, commit", "Sanity-check counts, note duplicate-report limitation, git commit, README skeleton"],
  ]},
  { week: "Week 2 — Statistics", tasks: [
    ["w2d1", "Day 1: Implement PRR/ROR", "2×2 contingency table function, hand-validate one row"],
    ["w2d2", "Day 2: Apply across all quarters", "Loop into signal_scores table, apply PRR≥2 / chi²≥4 / a≥3 criteria"],
    ["w2d3", "Day 3: Trend classification", "linregress slope over quarter-index → emerging / stable / declining"],
    ["w2d4", "Day 4: External validation", "Check top 1-2 flagged signals against published pharmacovigilance findings"],
    ["w2d5", "Day 5: Write methodology section", "PRR/ROR explanation, thresholds, limitations — feeds README + memo"],
  ]},
  { week: "Week 3 — Dashboard", tasks: [
    ["w3d1", "Day 1: Export CSV → Power BI import", ""],
    ["w3d2", "Day 2: Core PRR-over-time line chart", "Reference line at PRR = 2"],
    ["w3d3", "Day 3: Reaction/drug filter + KPI cards", "Current PRR, trend label, case count"],
    ["w3d4", "Day 4: Narrative callouts", "Text boxes pointing at the 1-2 validated signals"],
    ["w3d5", "Day 5: Polish + screenshot for GitHub", ""],
  ]},
  { week: "Week 4 — GenAI + Packaging", tasks: [
    ["w4d12", "Day 1-2: GenAI plain-language summary", "One bounded prompt, real PRR/ROR/trend as grounding — no RAG, no agents"],
    ["w4d3", "Day 3: Findings memo", "1-2 pages — problem, method, top findings, limitations, next steps"],
    ["w4d4", "Day 4: GitHub packaging", "README, data dictionary, requirements.txt (pinned), methodology citations"],
    ["w4d5", "Day 5: Buffer + resume bullet draft", ""],
  ]},
  { week: "Deliverables Checklist", tasks: [
    ["del-db", "SQLite database (faers.db)", "Documented schema"],
    ["del-scripts", "Python scripts", "extraction / PRR-ROR / trend classification as clean .py files"],
    ["del-pbix", "Power BI dashboard", ".pbix + 2-3 exported screenshots"],
    ["del-memo", "Findings memo", "1-2 pages, PDF or markdown"],
    ["del-repo", "GitHub repo", "Fully documented per standard structure"],
    ["del-genai", "GenAI summary feature", "Working end to end"],
  ]},
];

const STORAGE_KEY = "faers_progress_v1";
// Ids that were actually completed during the build session (verified against
// real code + real openFDA data, not assumed). Only applied on first load -
// once you've saved any progress yourself, your own checkbox state always wins.
const DEFAULT_DONE = [
  "setup-env", "setup-key", "setup-scope",
  "w1d1", "w1d2", "w1d3", "w1d4", "w1d5",
  "w2d1", "w2d2", "w2d3", "w2d4", "w2d5",
  "w3d1",
  "w4d3", "w4d4",
  "del-db", "del-scripts", "del-memo",
];

const hasSavedState = localStorage.getItem(STORAGE_KEY) !== null;
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
if (!hasSavedState) {
  DEFAULT_DONE.forEach(id => { state[id] = true; });
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function render(){
  const listEl = document.getElementById("tasklist");
  const weekBarsEl = document.getElementById("weekBars");
  listEl.innerHTML = "";
  weekBarsEl.innerHTML = "";

  let totalDone = 0, totalAll = 0;

  DATA.forEach(section => {
    const wrap = document.createElement("div");
    wrap.className = "week";
    const doneCount = section.tasks.filter(t => state[t[0]]).length;
    const pct = Math.round((doneCount / section.tasks.length) * 100);

    wrap.innerHTML = `<div class="week-head"><h2>${section.week}</h2><span class="week-pct">${doneCount}/${section.tasks.length}</span></div>`;

    section.tasks.forEach(([id, title, desc]) => {
      totalAll++;
      if (state[id]) totalDone++;
      const div = document.createElement("div");
      div.className = "task" + (state[id] ? " done" : "");
      div.innerHTML = `
        <input type="checkbox" ${state[id] ? "checked" : ""} data-id="${id}">
        <div class="task-text">
          <div class="task-title">${title}</div>
          ${desc ? `<div class="task-desc">${desc}</div>` : ""}
        </div>`;
      div.querySelector("input").addEventListener("change", e => {
        state[id] = e.target.checked;
        save();
        render();
      });
      div.addEventListener("click", (e) => {
        if (e.target.tagName !== "INPUT") {
          const cb = div.querySelector("input");
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event("change"));
        }
      });
      wrap.appendChild(div);
    });

    listEl.appendChild(wrap);

    const wbRow = document.createElement("div");
    wbRow.className = "wb-row";
    wbRow.innerHTML = `
      <div class="wb-label"><span>${section.week}</span><span>${pct}%</span></div>
      <div class="wb-track"><div class="wb-fill" style="width:${pct}%"></div></div>`;
    weekBarsEl.appendChild(wbRow);
  });

  const overallPct = totalAll ? Math.round((totalDone / totalAll) * 100) : 0;
  document.getElementById("bigPct").textContent = overallPct + "%";
  document.getElementById("bigLabel").textContent = `${totalDone} / ${totalAll} tasks complete`;
  document.getElementById("barFill").style.width = overallPct + "%";
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all progress?")) {
    Object.keys(state).forEach(k => delete state[k]);
    save();
    render();
  }
});

render();
</script>
</body>
</html>
